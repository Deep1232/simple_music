name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-audio
      - name: Build APK
        run: yes | flet build apk --yes --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: simple-music-apk
          path: build/apk/*.apk
