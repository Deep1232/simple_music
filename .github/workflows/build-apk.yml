name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Flet and Flutter
        run: |
          pip install --upgrade pip
          pip install "flet>=1.0.0" flet-audio
          flet doctor || true
      - name: Build APK
        run: flet build apk --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-music-apk
          path: build/apk/*.apk
