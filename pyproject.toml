[project]
name = "simple-music"
version = "0.1.0"
description = "Simple Music Player and Live Streaming App"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.0.0",
    "flet-audio>=1.0.0",
]

[tool.flet]
org = "com.example.simplemusic"
product = "Simple Music"
project = "simple_music"
permissions = [
    "READ_EXTERNAL_STORAGE",
    "READ_MEDIA_AUDIO",
    "INTERNET",
]
